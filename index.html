<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>云端音乐盒 | 在线播放器</title>
    <link rel="stylesheet" type="text/css" href="./css/audio.css">
    <!-- 确保所有图标和背景图资源位于正确目录，此处基于文件夹结构：images/ 存放所有图片(mode, 唱片封面, 按钮图标等)，mp3/ 存放音频，mp4/ 存放MV视频 -->
    <style>
        /* 添加学号姓名展示区域 - 不破坏原有布局，优雅显示 */
        .student-info {
            position: fixed;
            bottom: 12px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: #f0f0f0;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            z-index: 100;
            font-family: system-ui, 'Segoe UI', monospace;
            pointer-events: none;
            border-left: 3px solid #42b680;
        }
        /* 修复音量条显示位置微调 */
        #volumn-togger {
            margin-left: 8px;
            vertical-align: middle;
        }
        /* 播放列表高亮样式 */
        .all-list .active-song {
            background-color: #2e6b54 !important;
            border-left: 4px solid #ffd966;
            font-weight: 500;
        }
        /* MV弹窗浮层样式 */
        .mv-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        .mv-modal-content {
            background: #000000cc;
            border-radius: 28px;
            width: 75%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            position: relative;
        }
        .mv-modal video {
            width: 100%;
            display: block;
            outline: none;
            background: #000;
        }
        .close-mv {
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 32px;
            color: white;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 201;
            font-weight: bold;
        }
        .close-mv:hover {
            background: #42b680;
            transform: scale(1.05);
        }
        /* 优化唱片图片过渡 */
        #record-img {
            transition: background-image 0.2s ease;
        }
        /* 音量滑块可点 */
        .center-button-container {
            flex-wrap: wrap;
            gap: 6px;
        }
    </style>
</head>
<body id="body" background="./images/bg0.png">
    <!-- 固定显示学号姓名 (符合实验要求) -->
    <div class="student-info">
        🎓 学号：24215220116 &nbsp;|&nbsp; 姓名：廖岳锌
    </div>

    <div class="upper-container">
        <!-- 唱片区域 -->
        <div class="record-container">
            <div class="record-bg">
                <div id="record-img" class="rotate-play"></div>
            </div>
        </div>
        <!-- 歌曲信息区 -->
        <div class="introduction-container">
            <div class="text-container">
                <div id="music-title">洛春赋</div>
                <div class="author-container">
                    作者：<span id="author-name">云汐 / 朝野间</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 播放器控制栏 -->
    <div class="audio-box">
        <div class="audio-container">
            <audio id="audioTag" preload="auto"></audio>
            <!-- 进度条 -->
            <div class="a-progress">
                <div class="pgs-total" id="progress-total">
                    <div class="pgs-play" id="progress" style="width: 0%"></div>
                </div>
            </div>
            <!-- 控制按钮组 -->
            <div class="a-controls">
                <div class="time-container">
                    <span class="played-time" id="playedTime">00:00</span>&nbsp;/&nbsp;
                    <span class="audio-time" id="audioTime">00:00</span>
                </div>
                <div class="center-button-container">
                    <div id="playMode" class="center-icon mode" title="播放模式"></div>
                    <div id="skipForward" class="center-icon s-right" title="上一曲"></div>
                    <div id="playPause" class="icon-play" title="播放/暂停"></div>
                    <div id="skipBackward" class="center-icon s-left" title="下一曲"></div>
                    <div id="volume" class="center-icon volume" title="音量"></div>
                    <input type="range" id="volumn-togger" name="change" value="70" min="0" max="100" step="1">
                </div>
                <div class="bottom-button-container">
                    <div id="list" class="bottom-icon list" title="播放列表"></div>
                    <div id="speed" class="speed">1.0X</div>
                    <div id="MV" class="bottom-icon MV" title="音乐视频"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 播放列表遮罩 + 侧边栏 -->
    <div class="close-list" id="close-list"></div>
    <div class="music-list" id="music-list">
        <div class="music-list-container">
            <div class="music-list-title">🎵 播放队列</div>
            <hr class="line" />
            <div class="all-list" id="playlistContainer">
                <div id="music0" data-index="0">洛春赋</div>
                <div id="music1" data-index="1">Yesterday</div>
                <div id="music2" data-index="2">江南烟雨色</div>
                <div id="music3" data-index="3">Vision pt.II</div>
            </div>
        </div>
    </div>

    <!-- MV 弹窗模块 -->
    <div id="mvModal" class="mv-modal">
        <div class="mv-modal-content">
            <span class="close-mv" id="closeMvBtn">&times;</span>
            <video id="mvVideo" controls></video>
        </div>
    </div>

    <script>
        // ----------------------------- 播放器核心逻辑 ---------------------------------
        // 歌曲数据列表 (依据素材构建: 歌曲名, 作者, 封面图片, mp3路径, mv路径)
        const songList = [
            {
                title: "洛春赋",
                artist: "云汐 / 朝野间",
                cover: "./images/record0.jpg",
                src: "./mp3/music0.mp3",
                mvSrc: "./mp4/video0.mp4"
            },
            {
                title: "Yesterday",
                artist: "The Beatles",
                cover: "./images/record1.jpg",
                src: "./mp3/music1.mp3",
                mvSrc: "./mp4/video1.mp4"
            },
            {
                title: "江南烟雨色",
                artist: "杨树人 / 戾格",
                cover: "./images/record2.jpg",
                src: "./mp3/music2.mp3",
                mvSrc: "./mp4/video2.mp4"
            },
            {
                title: "Vision pt.II",
                artist: "Mountain／Muse",
                cover: "./images/record3.jpg",
                src: "./mp3/music3.mp3",
                mvSrc: "./mp4/video3.mp4"
            }
        ];

        // DOM 元素绑定
        const audio = document.getElementById('audioTag');
        const playPauseBtn = document.getElementById('playPause');
        const skipForward = document.getElementById('skipForward');   // 上一首
        const skipBackward = document.getElementById('skipBackward'); // 下一首
        const progressTotal = document.getElementById('progress-total');
        const progressFill = document.getElementById('progress');
        const playedTimeSpan = document.getElementById('playedTime');
        const audioTimeSpan = document.getElementById('audioTime');
        const musicTitle = document.getElementById('music-title');
        const authorNameSpan = document.getElementById('author-name');
        const recordImgDiv = document.getElementById('record-img');
        const playModeBtn = document.getElementById('playMode');
        const speedBtn = document.getElementById('speed');
        const volumeSlider = document.getElementById('volumn-togger');
        const volumeIcon = document.getElementById('volume');
        const mvBtn = document.getElementById('MV');
        const mvModal = document.getElementById('mvModal');
        const mvVideo = document.getElementById('mvVideo');
        const closeMv = document.getElementById('closeMvBtn');

        // 播放列表相关
        const listBtn = document.getElementById('list');
        const musicListPanel = document.getElementById('music-list');
        const closeListOverlay = document.getElementById('close-list');
        const playlistContainer = document.getElementById('playlistContainer');

        // 全局变量
        let currentIndex = 0;            // 当前歌曲索引
        let isPlaying = false;            // 播放状态
        let playMode = 0;                // 0:顺序循环 1:单曲循环 2:随机循环
        let currentSpeed = 1.0;          // 倍速

        // ---------- 辅助函数 ----------
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 更新播放器UI (歌曲信息,唱片封面,高亮列表)
        function updateUIForCurrentSong() {
            const song = songList[currentIndex];
            if (!song) return;
            musicTitle.innerText = song.title;
            authorNameSpan.innerText = song.artist;
            // 更换唱片封面 (背景图片)
            recordImgDiv.style.backgroundImage = `url('${song.cover}')`;
            recordImgDiv.style.backgroundSize = "100% 100%";
            // 高亮播放列表当前歌曲
            const allItems = document.querySelectorAll('.all-list div');
            allItems.forEach((item, idx) => {
                if (parseInt(item.getAttribute('data-index')) === currentIndex) {
                    item.classList.add('active-song');
                } else {
                    item.classList.remove('active-song');
                }
            });
            // 如果播放时切换歌曲，保持旋转动画与播放状态一致，但不要打断旋转类
            if (isPlaying) {
                recordImgDiv.classList.add('rotate-play');
                recordImgDiv.style.animationPlayState = 'running';
            } else {
                recordImgDiv.classList.add('rotate-play');
                recordImgDiv.style.animationPlayState = 'paused';
            }
        }

        // 加载歌曲 (不自动播放，但保留isPlaying标志，外部调用play)
        function loadSong(index) {
            if (index < 0) index = songList.length - 1;
            if (index >= songList.length) index = 0;
            currentIndex = index;
            const song = songList[currentIndex];
            audio.src = song.src;
            audio.load();       // 重新加载元数据
            updateUIForCurrentSong();
            // 重置进度条和时间显示
            progressFill.style.width = '0%';
            playedTimeSpan.innerText = '00:00';
            audioTimeSpan.innerText = '00:00';
            // 倍速设置重新应用
            audio.playbackRate = currentSpeed;
            // 如果当前是播放状态，则自动播放新歌
            if (isPlaying) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("自动播放被拦截，需用户交互:", error);
                        isPlaying = false;
                        playPauseBtn.className = 'icon-play';
                        recordImgDiv.style.animationPlayState = 'paused';
                    });
                }
            } else {
                // 暂停状态，确保按钮图标正确，唱片停转
                playPauseBtn.className = 'icon-play';
                recordImgDiv.style.animationPlayState = 'paused';
            }
        }

        // 播放当前歌曲
        function playCurrentSong() {
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.className = 'icon-pause';
                recordImgDiv.classList.add('rotate-play');
                recordImgDiv.style.animationPlayState = 'running';
            }).catch(e => {
                console.log("播放失败:", e);
                isPlaying = false;
                playPauseBtn.className = 'icon-play';
                recordImgDiv.style.animationPlayState = 'paused';
            });
        }

        // 暂停
        function pauseCurrentSong() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.className = 'icon-play';
            recordImgDiv.style.animationPlayState = 'paused';
        }

        // 切换播放/暂停
        function togglePlayPause() {
            if (isPlaying) {
                pauseCurrentSong();
            } else {
                playCurrentSong();
            }
        }

        // 下一曲 (依据播放模式)
        function nextTrack() {
            if (playMode === 1) {
                // 单曲循环：重新播放当前歌曲
                audio.currentTime = 0;
                if (isPlaying) audio.play();
                return;
            } else if (playMode === 2) {
                // 随机播放
                let newIndex = currentIndex;
                while (newIndex === currentIndex && songList.length > 1) {
                    newIndex = Math.floor(Math.random() * songList.length);
                }
                loadSong(newIndex);
            } else {
                // 顺序循环
                let next = (currentIndex + 1) % songList.length;
                loadSong(next);
            }
            if (isPlaying) {
                playCurrentSong();
            } else {
                // 如果当前不在播放状态，加载后仍保持暂停，但为了体验，可自动播放？根据通常逻辑：按下一曲后自动播放（提升体验）
                // 实验预期：点击下一曲后自动播放新歌，更合理。
                playCurrentSong();
            }
        }

        // 上一曲
        function prevTrack() {
            if (playMode === 1) {
                audio.currentTime = 0;
                if (isPlaying) audio.play();
                return;
            } else if (playMode === 2) {
                let newIndex = currentIndex;
                while (newIndex === currentIndex && songList.length > 1) {
                    newIndex = Math.floor(Math.random() * songList.length);
                }
                loadSong(newIndex);
            } else {
                let prev = (currentIndex - 1 + songList.length) % songList.length;
                loadSong(prev);
            }
            if (isPlaying) {
                playCurrentSong();
            } else {
                playCurrentSong();
            }
        }

        // 更新进度条和时间 (audio timeupdate)
        function updateProgress() {
            if (!isNaN(audio.duration) && audio.duration !== Infinity) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                playedTimeSpan.innerText = formatTime(audio.currentTime);
                audioTimeSpan.innerText = formatTime(audio.duration);
            } else {
                playedTimeSpan.innerText = formatTime(audio.currentTime);
                audioTimeSpan.innerText = '00:00';
            }
        }

        // 进度条点击跳转 (指定时间播放)
        function seekToTime(e) {
            const rect = progressTotal.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            let percent = clickX / width;
            if (percent < 0) percent = 0;
            if (percent > 1) percent = 1;
            const seekTime = percent * audio.duration;
            if (!isNaN(seekTime)) {
                audio.currentTime = seekTime;
            }
        }

        // 音量控制
        function setVolume(value) {
            const vol = value / 100;
            audio.volume = vol;
            // 改变音量图标（可选，静音特殊处理）
            if (vol === 0) {
                volumeIcon.style.backgroundImage = "url('./images/静音.png')";
            } else {
                volumeIcon.style.backgroundImage = "url('./images/音量.png')";
            }
        }

        // 播放模式切换
        function switchPlayMode() {
    playMode = (playMode + 1) % 3;
    if (playMode === 0) {          // 顺序播放
        playModeBtn.style.backgroundImage = "url('./images/mode2.png')";
        playModeBtn.setAttribute('title', '顺序播放');
    } else if (playMode === 1) {   // 单曲循环
        playModeBtn.style.backgroundImage = "url('./images/mode1.png')";
        playModeBtn.setAttribute('title', '单曲循环');
    } else {                        // 随机播放
        playModeBtn.style.backgroundImage = "url('./images/mode3.png')";
        playModeBtn.setAttribute('title', '随机播放');
    }
}

        // 倍速切换
        function toggleSpeed() {
            let newSpeed;
            if (currentSpeed === 1.0) newSpeed = 1.5;
            else if (currentSpeed === 1.5) newSpeed = 2.0;
            else if (currentSpeed === 2.0) newSpeed = 0.8;
            else newSpeed = 1.0;
            currentSpeed = newSpeed;
            audio.playbackRate = currentSpeed;
            speedBtn.innerText = currentSpeed.toFixed(1) + 'X';
        }

        // 显示播放列表 (带动画)
        function showPlaylist() {
            musicListPanel.style.display = 'block';
            closeListOverlay.style.display = 'block';
            // 触发进入动画
            musicListPanel.classList.remove('list-card-hide');
            musicListPanel.classList.add('list-card-show');
            closeListOverlay.classList.remove('list-card-hide');
            closeListOverlay.classList.add('list-card-show');
        }

        function hidePlaylist() {
            musicListPanel.classList.remove('list-card-show');
            musicListPanel.classList.add('list-card-hide');
            closeListOverlay.classList.remove('list-card-show');
            closeListOverlay.classList.add('list-card-hide');
            // 动画结束后隐藏
            setTimeout(() => {
                if (musicListPanel.classList.contains('list-card-hide')) {
                    musicListPanel.style.display = 'none';
                    closeListOverlay.style.display = 'none';
                }
            }, 300);
        }

        // MV 弹窗显示对应MV
        function showMV() {
            const song = songList[currentIndex];
            if (song && song.mvSrc) {
                mvVideo.src = song.mvSrc;
                mvVideo.load();
                mvModal.style.display = 'flex';
                // 自动播放MV (考虑到浏览器策略可尝试)
                mvVideo.play().catch(e => console.log("mv autoplay blocked, need user gesture"));
            } else {
                alert("当前歌曲暂无MV资源");
            }
        }
        function closeMVModal() {
            mvVideo.pause();
            mvVideo.src = "";
            mvModal.style.display = 'none';
        }

        // 监听音频结束自动下一曲
        function handleAudioEnd() {
            if (playMode === 1) {
                // 单曲循环：重新播放
                audio.currentTime = 0;
                if (isPlaying) audio.play();
            } else {
                nextTrack(); // 下一曲（已经涵盖随机/顺序逻辑）
            }
        }

        // 当歌曲元数据加载完毕，显示总时长，并且与当前进度同步
        function onLoadedMetadata() {
            audioTimeSpan.innerText = formatTime(audio.duration);
        }

        // 初始化列表点击事件
        function initPlaylistClick() {
            const items = document.querySelectorAll('.all-list div');
            items.forEach(item => {
                item.addEventListener('click', (e) => {
                    const idx = parseInt(item.getAttribute('data-index'));
                    if (!isNaN(idx) && idx !== currentIndex) {
                        loadSong(idx);
                        // 切换后自动播放
                        playCurrentSong();
                    } else if (idx === currentIndex) {
                        // 同一首，不做切换，但可关闭列表
                        if (isPlaying) pauseCurrentSong();
                        else playCurrentSong();
                    }
                    // 点击后自动隐藏列表 （体验优化）
                    hidePlaylist();
                    e.stopPropagation();
                });
            });
        }

        // 背景图片修复(保证唱片容器旋转类存在)
        function initRotationClass() {
            if (!recordImgDiv.classList.contains('rotate-play')) {
                recordImgDiv.classList.add('rotate-play');
            }
            recordImgDiv.style.animationPlayState = 'paused';
        }

        // 音量滑块初始化
        function initVolume() {
            audio.volume = volumeSlider.value / 100;
            volumeSlider.addEventListener('input', (e) => {
                setVolume(e.target.value);
            });
            volumeIcon.addEventListener('click', () => {
                // 快速静音/恢复之前音量
                if (audio.volume > 0) {
                    audio.dataset.prevVol = audio.volume;
                    setVolume(0);
                    volumeSlider.value = 0;
                } else {
                    let prev = audio.dataset.prevVol ? parseFloat(audio.dataset.prevVol) : 0.7;
                    setVolume(prev * 100);
                    volumeSlider.value = prev * 100;
                }
            });
        }

        // 修复所有图标路径根据实际images文件夹 (确保播放控制等图标正常)
        function fixIconPaths() {
            // 确保模式图标/音量等初始背景正确 (如果css背景失效，js动态设置)
            playModeBtn.style.backgroundImage = "url('./images/mode1.png')";
            document.getElementById('skipForward').style.backgroundImage = "url('./images/上一首.png')";
            document.getElementById('skipBackward').style.backgroundImage = "url('./images/下一首.png')";
            document.getElementById('playPause').classList.contains('icon-play') ? 
                document.getElementById('playPause').style.backgroundImage = "url('./images/继续播放.png')" : null;
            document.getElementById('volume').style.backgroundImage = "url('./images/音量.png')";
            document.getElementById('list').style.backgroundImage = "url('./images/列表.png')";
            document.getElementById('MV').style.backgroundImage = "url('./images/MV.png')";
            // 修正暂停/播放图标初始
            const pp = document.getElementById('playPause');
            if (pp.classList.contains('icon-play')) {
                pp.style.backgroundImage = "url('./images/继续播放.png')";
            } else {
                pp.style.backgroundImage = "url('./images/暂停.png')";
            }
        }

        // 监听播放按钮样式变化(动态切换图标)
        function observePlayPauseIcon() {
            const ppDiv = document.getElementById('playPause');
            const updateIcon = () => {
                if (isPlaying) {
                    ppDiv.style.backgroundImage = "url('./images/暂停.png')";
                    ppDiv.classList.remove('icon-play');
                    ppDiv.classList.add('icon-pause');
                } else {
                    ppDiv.style.backgroundImage = "url('./images/继续播放.png')";
                    ppDiv.classList.remove('icon-pause');
                    ppDiv.classList.add('icon-play');
                }
            };
            // 初始调用
            updateIcon();
            // 劫持 set 方式通过事件与播放状态绑定
            const origToggle = togglePlayPause;
            window.togglePlayPause = togglePlayPause;
            // 简单监听自定义: 每次isPlaying变化刷新
            const interval = setInterval(() => {
                if ((isPlaying && ppDiv.style.backgroundImage.indexOf('暂停') === -1) ||
                    (!isPlaying && ppDiv.style.backgroundImage.indexOf('继续') === -1)) {
                    updateIcon();
                }
            }, 100);
            // 不需要清除，保持持久有效即可
            return () => clearInterval(interval);
        }

        // ---------- 事件绑定 ----------
        function bindEvents() {
            playPauseBtn.addEventListener('click', togglePlayPause);
            skipForward.addEventListener('click', prevTrack);
            skipBackward.addEventListener('click', nextTrack);
            progressTotal.addEventListener('click', seekToTime);
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', handleAudioEnd);
            audio.addEventListener('loadedmetadata', onLoadedMetadata);
            playModeBtn.addEventListener('click', switchPlayMode);
            speedBtn.addEventListener('click', toggleSpeed);
            listBtn.addEventListener('click', showPlaylist);
            closeListOverlay.addEventListener('click', hidePlaylist);
            mvBtn.addEventListener('click', showMV);
            closeMv.addEventListener('click', closeMVModal);
            mvModal.addEventListener('click', (e) => {
                if (e.target === mvModal) closeMVModal();
            });
        }

        // 初始加载默认第一首歌并预置
        function initPlayer() {
            fixIconPaths();          // 修正图片路径依赖
            initRotationClass();
            initVolume();
            // 加载第一首歌曲并设置默认封面
            currentIndex = 0;
            loadSong(0);
            updateUIForCurrentSong();
            // 初始模式按钮默认顺序循环
            playMode = 0;
            playModeBtn.style.backgroundImage = "url('./images/mode1.png')";
            // 默认音量显示
            setVolume(volumeSlider.value);
            // 播放列表点击绑定
            initPlaylistClick();
            bindEvents();
            observePlayPauseIcon();
            // 由于自动播放策略, 初始加载不自动播放, 展示暂停, 用户点击播放按钮交互
            isPlaying = false;
            playPauseBtn.className = 'icon-play';
            recordImgDiv.style.animationPlayState = 'paused';
            // 额外修复进度条初始宽度
            progressFill.style.width = '0%';
            // 隐藏列表初始状态
            musicListPanel.style.display = 'none';
            closeListOverlay.style.display = 'none';
            // 背景音乐兼容性: 页面加载时确保一些浏览器需要点击才能播放, 不加自动播放以避免策略报错
            console.log("播放器就绪，支持上一曲/下一曲/播放列表/跳转/音量/倍速/MV");
        }

        // 启动一切
        initPlayer();
    </script>
</body>
</html>
